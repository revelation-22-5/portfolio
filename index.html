<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>임재훈 — Mechanical Design Portfolio</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>

<style>
:root{
  --bg:      #F5F4F0;
  --txt:     #1A1A1A;
  --sub:     #6B6B6B;
  --accent:  #2B4C7E;
  --line:    #E5E3DD;

  --viewer-bg:   #1C2128;
  --viewer-line: #2E3540;
  --viewer-txt:  #C4CCD6;
  --viewer-sub:  #7F8A99;
  --viewer-accent:#7FA8D8;

  --font-body:'Pretendard Variable',Pretendard,-apple-system,sans-serif;
  --font-disp:'Pretendard Variable',Pretendard,sans-serif;
  --font-mono:'Pretendard Variable',Pretendard,sans-serif;
  --sidebar-w: 240px;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:auto}
body{
  background:var(--bg);color:var(--txt);
  font-family:var(--font-body);
  -webkit-font-smoothing:antialiased;line-height:1.6;
  font-variant-numeric:tabular-nums;
}
::selection{background:var(--accent);color:var(--bg)}

nav.side{
  position:fixed;left:0;top:0;bottom:0;width:var(--sidebar-w);
  padding:44px 32px;border-right:1px solid var(--line);
  display:flex;flex-direction:column;z-index:100;background:var(--bg);
}
.side .who{margin-bottom:52px}
.side .who .nm{font-family:var(--font-disp);font-weight:800;font-size:20px;letter-spacing:-.01em}
.side .who .rl{font-family:var(--font-mono);font-size:10.5px;color:var(--sub);letter-spacing:.14em;margin-top:4px}
.side ol{list-style:none;display:flex;flex-direction:column;gap:2px}
.side ol a{display:flex;align-items:baseline;gap:10px;text-decoration:none;padding:7px 10px;border-radius:6px;transition:.25s}
.side ol a .no{font-family:var(--font-mono);font-size:10px;color:var(--sub);width:18px}
.side ol a .tt{font-size:13px;color:var(--sub);font-weight:500;transition:.25s}
.side ol a:hover .tt{color:var(--txt)}
.side ol a.on{background:#fff}
.side ol a.on .tt{color:var(--accent);font-weight:700}
.side ol a.on .no{color:var(--accent)}
.side .foot{margin-top:auto;font-family:var(--font-mono);font-size:10px;color:var(--sub);letter-spacing:.06em;line-height:1.8}

main{margin-left:var(--sidebar-w)}
section{border-bottom:1px solid var(--line)}

#hero{min-height:100vh;display:grid;grid-template-columns:1fr 1fr;align-items:center;padding:0 56px;position:relative;overflow:hidden}
#hero .txt h1{font-family:var(--font-disp);font-weight:800;font-size:clamp(44px,5.6vw,84px);line-height:1.02;letter-spacing:-.03em}
#hero .txt h1 .accent{color:var(--accent)}
#hero .txt .tag{margin-top:22px;font-size:16px;color:var(--sub);max-width:42ch}
#hero .txt .meta{margin-top:36px;display:flex;gap:26px;font-family:var(--font-mono);font-size:11px;color:var(--sub);letter-spacing:.06em;line-height:1.7}
#hero .txt .meta b{display:block;color:var(--txt);font-size:14px;margin-bottom:6px;letter-spacing:0}
#hero .stage{height:auto;align-self:center;display:flex;flex-direction:column;justify-content:center;gap:16px;padding:70px 0}
.hvid{aspect-ratio:16/9;border-radius:14px;overflow:hidden;border:1px solid var(--line);background:#fff}
.hvid iframe{width:100%;height:100%;border:none;display:block}
.bigmedia{position:sticky;top:70px;display:flex;flex-direction:column;gap:14px}
.bigmedia .mitem{aspect-ratio:16/9}
#hero .scroll-hint{position:absolute;bottom:30px;left:56px;font-family:var(--font-mono);font-size:10px;letter-spacing:.22em;color:var(--sub);display:flex;align-items:center;gap:10px}
.scroll-hint .bar{width:1px;height:34px;background:var(--line);position:relative;overflow:hidden}
.scroll-hint .bar::after{content:'';position:absolute;left:0;top:-40%;width:100%;height:40%;background:var(--accent);animation:drip 2s ease-in-out infinite}
@keyframes drip{to{top:110%}}

.proj{padding:0 56px}
.proj .inner{min-height:158vh;padding:80px 0 90px}
.proj header.ph{margin-bottom:34px;max-width:900px}
.proj .eyebrow{font-family:var(--font-mono);font-size:11px;letter-spacing:.18em;color:var(--accent);display:flex;align-items:center;gap:12px;margin-bottom:14px}
.proj .eyebrow::after{content:'';flex:0 0 44px;height:1px;background:var(--accent);opacity:.4}
.proj h2{font-family:var(--font-disp);font-weight:700;font-size:clamp(28px,3.2vw,46px);letter-spacing:-.02em;line-height:1.08}
.proj .sub{margin-top:10px;color:var(--sub);font-size:15px;max-width:62ch}

.proj .grid{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:28px;align-items:start}
.viewer-wrap{position:sticky;top:70px}
.viewer{position:relative;height:calc(100vh - 140px);min-height:480px;background:var(--viewer-bg);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.viewer canvas{display:block;width:100%;height:100%}
.viewer .vhud{position:absolute;top:14px;left:16px;pointer-events:none;font-family:var(--font-mono);font-size:10px;color:var(--viewer-sub);letter-spacing:.08em;line-height:1.9}
.viewer .vhud .k{color:var(--viewer-accent)}
.viewer .vctrl{position:absolute;bottom:14px;right:16px;display:flex;gap:6px}
.viewer .vctrl button{font-family:var(--font-mono);font-size:10.5px;color:var(--viewer-sub);background:rgba(255,255,255,.04);border:1px solid var(--viewer-line);border-radius:6px;padding:6px 11px;cursor:pointer;transition:.2s}
.viewer .vctrl button:hover{color:var(--viewer-accent);border-color:var(--viewer-accent)}
.viewer .vload{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--font-mono);font-size:11px;color:var(--viewer-sub);letter-spacing:.14em;background:var(--viewer-bg);transition:opacity .5s}
.viewer .vload.off{opacity:0;pointer-events:none}

.hs{position:absolute;width:24px;height:24px;transform:translate(-50%,-50%);cursor:pointer;z-index:6}
.hs .dot{width:24px;height:24px;border-radius:50%;border:1.5px solid var(--viewer-accent);background:rgba(127,168,216,.14);display:grid;place-items:center;color:var(--viewer-accent);font-size:15px;font-weight:400;transition:.2s}
.hs .dot::before{content:'';position:absolute;inset:-5px;border-radius:50%;border:1px solid var(--viewer-accent);opacity:.35;animation:hsPulse 2.6s infinite}
@keyframes hsPulse{0%{transform:scale(.85);opacity:.45}100%{transform:scale(1.55);opacity:0}}
.hs:hover .dot,.hs.on .dot{background:var(--viewer-accent);color:var(--viewer-bg)}

.hs-card{position:absolute;left:14px;bottom:14px;width:min(320px,72%);background:rgba(28,33,40,.92);border:1px solid var(--viewer-line);border-radius:12px;padding:16px 18px;z-index:8;box-shadow:0 12px 30px rgba(0,0,0,.35);backdrop-filter:blur(6px);opacity:0;transform:translateY(8px);pointer-events:none;transition:.28s}
.hs-card.show{opacity:1;transform:none;pointer-events:auto}
.hs-card .ci{font-family:var(--font-mono);font-size:10px;color:var(--viewer-accent);letter-spacing:.14em}
.hs-card h4{font-size:15px;font-weight:700;margin:4px 0 6px;color:var(--viewer-txt)}
.hs-card p{font-size:12.5px;color:var(--viewer-sub);line-height:1.6}
.hs-card .cs{display:flex;gap:8px;margin-top:10px}
.hs-card .cs div{flex:1;background:rgba(255,255,255,.04);border:1px solid var(--viewer-line);border-radius:8px;padding:8px 10px}
.hs-card .cs .l{font-family:var(--font-mono);font-size:9.5px;color:var(--viewer-sub);letter-spacing:.06em}
.hs-card .cs .v{font-family:var(--font-mono);font-size:13.5px;color:var(--viewer-accent);font-weight:600;margin-top:2px}
.hs-card .cx{position:absolute;top:10px;right:12px;border:none;background:none;cursor:pointer;color:var(--viewer-sub);font-size:14px;line-height:1}
.hs-card .cx:hover{color:var(--viewer-txt)}

.panel{display:flex;flex-direction:column;gap:22px}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:26px 28px}
.card .ct{font-family:var(--font-mono);font-size:10.5px;letter-spacing:.18em;color:var(--sub);display:flex;align-items:center;gap:10px;margin-bottom:18px;text-transform:uppercase}
.card .ct::before{content:'';width:16px;height:1px;background:var(--accent)}

/* ── 개선된 설계 사양표: 카테고리 그룹 + 값 강조 ── */
table.spec{width:100%;border-collapse:collapse}
table.spec td{padding:9px 4px;font-size:13.5px;vertical-align:baseline;border-bottom:1px solid var(--line)}
table.spec tr:last-child td{border-bottom:none}
table.spec td.k{color:var(--sub);width:52%}
table.spec td.v{font-family:var(--font-mono);text-align:right;font-weight:500;white-space:nowrap}
table.spec td.v .unit{color:var(--sub);font-size:11px;margin-left:3px}
table.spec td.v .num{color:var(--txt)}
table.spec tr.cat td{
  border-bottom:none;padding:16px 4px 6px;
  font-family:var(--font-mono);font-size:10px;letter-spacing:.16em;
  color:var(--accent);text-transform:uppercase;font-weight:700;
}
table.spec tr.cat:first-child td{padding-top:2px}
table.spec td.v.hl .num{color:var(--accent);font-weight:700;font-size:14.5px}

.formula{margin-top:16px;padding:16px 14px;background:var(--bg);border:1px solid var(--line);border-radius:10px;overflow-x:auto}
.formula .fl{font-family:var(--font-mono);font-size:9.5px;color:var(--sub);letter-spacing:.1em;margin-bottom:8px}
.formula .ktx{font-size:14px}

.media-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mitem{aspect-ratio:16/10;border-radius:10px;border:1px solid var(--line);overflow:hidden;position:relative;background:var(--bg)}
.mitem.wide{grid-column:1/3;aspect-ratio:16/8.4}
.mitem img,.mitem iframe,.mitem video{width:100%;height:100%;object-fit:cover;border:none;display:block}
.mitem .cap{position:absolute;left:0;right:0;bottom:0;padding:8px 10px 7px;font-family:var(--font-mono);font-size:9.5px;letter-spacing:.05em;color:#fff;background:linear-gradient(0deg,rgba(26,26,26,.65),transparent)}
.mitem .ph{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--font-mono);font-size:10px;color:var(--sub);letter-spacing:.1em;text-align:center;line-height:1.8}

.rise{opacity:0;transform:translateY(22px);transition:opacity .7s ease,transform .7s ease}
.rise.in{opacity:1;transform:none}

#contact{min-height:88vh;display:grid;place-items:center;padding:80px 56px;border-bottom:none}
#contact .cwrap{display:grid;grid-template-columns:auto 1fr;gap:56px;align-items:center;max-width:860px;width:100%}
#contact .photo{width:220px;height:280px;border-radius:14px;border:1px solid var(--line);background:#fff;overflow:hidden;display:grid;place-items:center;font-family:var(--font-mono);font-size:10px;color:var(--sub);letter-spacing:.1em}
#contact .photo img{width:100%;height:100%;object-fit:cover}
#contact h2{font-family:var(--font-disp);font-weight:800;font-size:clamp(30px,3.4vw,50px);letter-spacing:-.02em}
#contact .cl{margin-top:26px;display:flex;flex-direction:column;gap:12px}
#contact .cl a{display:flex;align-items:baseline;gap:16px;text-decoration:none;color:var(--txt);font-size:16px;padding-bottom:10px;border-bottom:1px solid var(--line);transition:.2s}
#contact .cl a .lb{font-family:var(--font-mono);font-size:10px;color:var(--sub);letter-spacing:.14em;width:52px}
#contact .cl a:hover{color:var(--accent)}

@media(max-width:1020px){
  nav.side{position:sticky;top:0;bottom:auto;width:100%;height:auto;flex-direction:row;align-items:center;gap:18px;padding:14px 20px;border-right:none;border-bottom:1px solid var(--line);overflow-x:auto}
  .side .who{margin:0;flex:0 0 auto}
  .side .who .rl{display:none}
  .side ol{flex-direction:row;gap:4px}
  .side ol a{padding:5px 9px}
  .side ol a .tt{display:none}
  .side .foot{display:none}
  main{margin-left:0}
  #hero{grid-template-columns:1fr;padding:0 22px;gap:0}
  #hero .stage{height:auto;order:-1;margin-top:60px}
  .proj{padding:0 22px}
  .proj .inner{min-height:auto;padding:60px 0}
  .proj .grid{grid-template-columns:1fr}
  .viewer-wrap{position:relative;top:0}
  .viewer{height:56vh;min-height:380px}
  #contact .cwrap{grid-template-columns:1fr;gap:30px;justify-items:center;text-align:center}
  #contact .cl a{justify-content:center}
}
@media(prefers-reduced-motion:reduce){
  .rise{transition:none;opacity:1;transform:none}
  .scroll-hint .bar::after,.hs .dot::before{animation:none}
}
</style>
</head>

function mItem(m, extraCls=''){
  if(m.type==='youtube') return `<div class="mitem${extraCls}">${m.id
    ? `<iframe src="https://www.youtube.com/embed/${m.id}" allowfullscreen loading="lazy"></iframe>`
    : `<div class="ph">YOUTUBE ID를<br>CONFIG에 입력</div>`}<div class="cap">${m.cap}</div></div>`;
  if(m.type==='video') return `<div class="mitem${extraCls}">${m.src
    ? `<video src="${m.src}" autoplay loop muted playsinline preload="metadata" onplay="this.playbackRate=${m.speed || 1.0};"></video>`
    : `<div class="ph">영상(MP4) 경로를<br>CONFIG에 입력</div>`}<div class="cap">${m.cap}</div></div>`;
  return `<div class="mitem${extraCls}">${m.src
    ? `<img src="${m.src}" alt="${m.cap}" loading="lazy">`
    : `<div class="ph">이미지 경로를<br>CONFIG에 입력</div>`}<div class="cap">${m.cap}</div></div>`;
}

function specRow(s){
  if(s.cat) return `<tr class="cat"><td colspan="2">${s.cat}</td></tr>`;

    : `<span class="num">${s.v}</span>`;
  return `<tr><td class="k">${s.k}</td>
    <td class="v${s.hl?' hl':''}">${valInner}${s.unit?`<span class="unit">${s.unit}</span>`:''}</td></tr>`;
}

const spy = new IntersectionObserver(es=>{
  es.forEach(e=>{
    if(!e.isIntersecting) return;
    document.querySelectorAll('#toc a').forEach(a=>a.classList.toggle('on', a.dataset.target===e.target.id));
  });
},{rootMargin:'-45% 0px -50% 0px'});
tocItems.forEach(i=>{ const s=document.getElementById(i.id); if(s) spy.observe(s); });

const riser = new IntersectionObserver(es=>{
  es.forEach((e)=>{ if(e.isIntersecting){ e.target.classList.add('in'); riser.unobserve(e.target); }});
},{threshold:.15});
document.querySelectorAll('.rise').forEach((r,i)=>{ r.style.transitionDelay = `${(i%4)*70}ms`; riser.observe(r); });

const counter = new IntersectionObserver(es=>{
  es.forEach(e=>{
    if(!e.isIntersecting) return;
    const t = e.target, end = parseFloat(t.dataset.count);
    const dec = (String(t.dataset.count).split('.')[1]||'').length;
    const dur = 1200, t0 = performance.now();
    (function tick(now){
      const pr = Math.min((now-t0)/dur, 1), ease = 1-Math.pow(1-pr,3);
      t.textContent = (end*ease).toLocaleString(undefined,{minimumFractionDigits:dec,maximumFractionDigits:dec});
      if(pr<1) requestAnimationFrame(tick);
    })(t0);
    counter.unobserve(t);
  });
},{threshold:.6});
document.querySelectorAll('[data-count]').forEach(n=>counter.observe(n));

});

  const acc = new THREE.MeshStandardMaterial({color:0x2B4C7E, metalness:.5, roughness:.5});
  const a = new THREE.Mesh(new THREE.BoxGeometry(1.6,.5,.8), mat); a.position.y=-.55;
  const b = new THREE.Mesh(new THREE.CylinderGeometry(.22,.22,1.5,24), mat); b.rotation.z=.5;
  const c = new THREE.Mesh(new THREE.CylinderGeometry(.3,.3,.7,20), acc); c.rotation.x=Math.PI/2; c.position.set(-.6,-.5,0);
  g.add(a,b,c); return g;
}

function initViewer(box, proj){
  const scene = new THREE.Scene();
  const cam = new THREE.PerspectiveCamera(42, box.clientWidth/box.clientHeight, .05, 100);
  const camHome = proj.cam || [2.6, 1.2, 3.4];
  cam.position.set(...camHome);
  const ren = new THREE.WebGLRenderer({antialias:true, alpha:true});
  ren.setSize(box.clientWidth, box.clientHeight);
  ren.setPixelRatio(Math.min(devicePixelRatio, 2));
  ren.outputEncoding = THREE.sRGBEncoding;
  box.prepend(ren.domElement);

  scene.add(new THREE.HemisphereLight(0xffffff, 0x30363f, 1.0));
  const key = new THREE.DirectionalLight(0xffffff, 1.0); key.position.set(4,6,4); scene.add(key);
  const rim = new THREE.DirectionalLight(0x9fb4d4, .6); rim.position.set(-4,2,-3); scene.add(rim);

  const pivot = new THREE.Group(); scene.add(pivot);
  const tilt = new THREE.Group(); pivot.add(tilt);
  tilt.rotation.x = proj.modelPitch || 0;
  tilt.rotation.z = proj.modelRoll  || 0;
  const loadEl = box.querySelector('.vload');
  const ctl = new THREE.OrbitControls(cam, ren.domElement);
  ctl.enableDamping = true; ctl.dampingFactor = .08;
  ctl.enableZoom = false; ctl.enablePan = false;
  ctl.minPolarAngle = -Infinity; ctl.maxPolarAngle = Infinity; ctl.rotateSpeed = 0.9;

  function fit(obj){
    const bb = new THREE.Box3().setFromObject(obj);
    const size = bb.getSize(new THREE.Vector3()), ctr = bb.getCenter(new THREE.Vector3());
    const s = 3.0/Math.max(size.x,size.y,size.z);
    obj.position.sub(ctr); obj.scale.setScalar(s); obj.position.multiplyScalar(s);
    if(!proj.cam){
      const dist = 3.0 / Math.tan((cam.fov*Math.PI/180)/2) * 0.62;
      cam.position.set(dist*0.62, dist*0.42, dist*0.86);
      camHome[0]=cam.position.x; camHome[1]=cam.position.y; camHome[2]=cam.position.z;
      ctl.target.set(0,0,0); ctl.update();
    }
  }

  if (proj.glb) {
    GLTF_LOADER.load(proj.glb,
      g=>{ fit(g.scene); tilt.add(g.scene); loadEl.classList.add('off'); },
      undefined,
      (err)=>{ console.error('[GLB load fail]', proj.glb, err);
            const ph=makePlaceholder(); tilt.add(ph);
            loadEl.textContent='GLB 로드 실패 — 콘솔(F12) 확인';
            setTimeout(()=>loadEl.classList.add('off'),1600); });
  } else { tilt.add(makePlaceholder()); loadEl.classList.add('off'); }
  pivot.rotation.y = proj.modelYaw || 0;

  const V = { scene, cam, ren, pivot, ctl, box, proj, scrollRot:0, userHold:0, active:false, hsEls:[] };
  ren.domElement.addEventListener('pointerdown', ()=>V.userHold = performance.now()+4000);

  box.querySelectorAll('.vctrl button').forEach(b=>{
    b.addEventListener('click', ()=>{
      const dir = cam.position.clone().normalize();
      if(b.dataset.act==='zin')  cam.position.addScaledVector(dir,-.4);
      if(b.dataset.act==='zout') cam.position.addScaledVector(dir, .4);
      if(b.dataset.act==='reset'){ cam.position.set(...camHome); ctl.target.set(0,0,0); V.userHold=0; }
      cam.position.clampLength(1.8, 16);
    });
  });

  const card = box.querySelector('.hs-card');
  proj.hotspots.forEach((h,idx)=>{
    const e = el('div','hs',`<div class="dot">+</div>`);
    box.appendChild(e); V.hsEls.push({e,h});
    e.addEventListener('click', ()=>{
      V.hsEls.forEach(o=>o.e.classList.remove('on')); e.classList.add('on');
      card.querySelector('.ci').textContent = `COMPONENT ${String(idx+1).padStart(2,'0')}`;
      card.querySelector('h4').textContent = h.t;
      card.querySelector('p').textContent = h.d;
      card.querySelector('.cs').innerHTML = h.s.map(x=>`<div><div class="l">${x[0]}</div><div class="v">${x[1]}</div></div>`).join('');
      card.classList.add('show');
      V.userHold = performance.now()+8000;
    });
  });
  card.querySelector('.cx').addEventListener('click', ()=>{ card.classList.remove('show'); V.hsEls.forEach(o=>o.e.classList.remove('on')); });

  if (SITE.hotspotHelper) {
    const rc = new THREE.Raycaster(), m2 = new THREE.Vector2();
    const tag = el('div','', '클릭: 좌표 찍기');
    tag.style.cssText = 'position:absolute;top:14px;right:14px;z-index:20;font:12px/1.5 monospace;background:#ffcc00;color:#111;padding:8px 10px;border-radius:8px;max-width:70%;cursor:pointer';
    box.appendChild(tag);
    ren.domElement.style.cursor = 'crosshair';
    ren.domElement.addEventListener('click', (ev)=>{
      const r = ren.domElement.getBoundingClientRect();
      m2.x = ((ev.clientX-r.left)/r.width)*2-1;
      m2.y = -((ev.clientY-r.top)/r.height)*2+1;
      rc.setFromCamera(m2, cam);
      const hit = rc.intersectObject(pivot, true)[0];
      if(!hit){ tag.textContent='빈 곳 — 모델 표면을 클릭'; return; }
      const p = pivot.worldToLocal(hit.point.clone());
      const s = v=>Math.round(v*100)/100;
      const txt = `pos:[${s(p.x)}, ${s(p.y)}, ${s(p.z)}]`;
      tag.textContent = txt + '  (클릭하면 복사)';
      tag.onclick = ()=>{ navigator.clipboard?.writeText(txt); tag.textContent='복사됨! ' + txt; };
      console.log('[hotspot]', txt);
    });
  }

  const sec = box.closest('section');
  if (window.gsap && window.ScrollTrigger) {
    gsap.registerPlugin(ScrollTrigger);
    ScrollTrigger.create({ trigger: sec, start:'top bottom', end:'bottom top', scrub:true,
      onUpdate: st => V.scrollRot = st.progress * Math.PI * (proj.rot ?? 1.6) });
  } else {
    addEventListener('scroll', ()=>{
      const r = sec.getBoundingClientRect();
      const pr = Math.min(Math.max(1 - (r.bottom)/(innerHeight + r.height), 0), 1);
      V.scrollRot = pr * Math.PI * 1.6;
    }, {passive:true});
  }

  addEventListener('resize', ()=>{
    cam.aspect = box.clientWidth/box.clientHeight; cam.updateProjectionMatrix();
    ren.setSize(box.clientWidth, box.clientHeight);
  });

  VIEWERS.push(V); return V;
}

const vio = new IntersectionObserver(es=>{
  es.forEach(e=>{
    const box = e.target;
    if(e.isIntersecting && !box.dataset.init){
      box.dataset.init = '1';
      const proj = PROJECTS.find(p=>p.id===box.dataset.proj);
      initViewer(box, proj);
    }
    const v = VIEWERS.find(v=>v.box===box);
    if(v) v.active = e.isIntersecting;
  });
},{rootMargin:'150px'});
document.querySelectorAll('.viewer').forEach(b=>vio.observe(b));

const _v3 = new THREE.Vector3();
function loop(){
  requestAnimationFrame(loop);
  const now = performance.now();
  VIEWERS.forEach(V=>{
    if(!V.active) return;
    const userBusy = now < V.userHold;
    if(!userBusy){
      const target = (V.proj.modelYaw||0) + V.scrollRot;
      V.pivot.rotation.y += (target - V.pivot.rotation.y) * .06;
    }
    V.ctl.update();
    V.ren.render(V.scene, V.cam);
    V.hsEls.forEach(o=>{
      _v3.set(...o.h.pos).applyMatrix4(V.pivot.matrixWorld).project(V.cam);
      const x = (_v3.x*.5+.5)*V.box.clientWidth, y = (-_v3.y*.5+.5)*V.box.clientHeight;
      o.e.style.left = x+'px'; o.e.style.top = y+'px';
      o.e.style.display = (_v3.z<1 && x>0 && x<V.box.clientWidth) ? 'block':'none';
    });
  });
}
loop();
</script>
</body>
</html>
